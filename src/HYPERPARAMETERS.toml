
[sentencepiece]
# Core settings
vocab_size = 8000            # Size of vocabulary
emb_dim = 128                # Embedding dimension
spm_model_type = "unigram"       # Algorithm type (unigram or bpe)
character_coverage = 1.0     # Character coverage

# Special tokens
pad_token = "[PAD]"
bos_token = "[BOS]"         # Beginning of sentence
eos_token = "[EOS]"         # End of sentence
unk_token = "[UNK]"         # Unknown token

[model]
model_name = "mlx5.4-transformer"
model_version = "0.1.0"
nn_model_type = "transformer"
max_seq_len = 128
hidden_size = 128

[training]
batch_size = 16
learning_rate = 0.001

[environment]
device = "mps"
seed = 42